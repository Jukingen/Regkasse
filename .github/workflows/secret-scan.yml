name: Secret scan

# Blocks tracked files that look like real secrets (PEMs, live keys, appsettings).
# Same scanner as Husky pre-commit (`scripts/git-hooks/scan-secrets.mjs`).

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked files for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Unit tests (scanner)
        run: npm run test:secrets

      - name: Scan git-tracked files
        run: npm run verify:secrets
