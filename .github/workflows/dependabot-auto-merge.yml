name: Dependabot auto-merge

# Enables squash auto-merge for Dependabot patch and minor updates.
# GitHub completes the merge only after required status checks pass.
# Major updates are left open for review.
# Prerequisite: Settings → General → Allow auto-merge. Squash merges must be allowed.

on:
  pull_request:
    branches: [main, master]

jobs:
  auto-merge:
    name: Auto-merge patch and minor
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Root `npm ci` reads package-lock.json. A workspace package.json that
      # only updates <workspace>/package-lock.json still breaks that install
      # (Dependabot #119 / #120). The workspace lock does not replace the root lock.
      - name: Require root lockfile for package.json changes
        id: lockfile
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          diff_file="$(mktemp)"
          gh pr diff "$PR_URL" --name-only > "$diff_file"

          has_root_lock=0
          manifests=()
          while IFS= read -r path || [ -n "$path" ]; do
            [ -z "$path" ] && continue
            if [ "$path" = "package-lock.json" ]; then
              has_root_lock=1
            fi
            case "$path" in
              package.json|*/package.json)
                manifests+=("$path")
                ;;
            esac
          done < "$diff_file"

          if [ "${#manifests[@]}" -eq 0 ] || [ "$has_root_lock" -eq 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          comment_file="${RUNNER_TEMP:-/tmp}/dependabot-lockfile-guard.md"
          {
            echo "Auto-merge skipped: this pull request changes a \`package.json\` without the root \`package-lock.json\`."
            echo
            echo "Root \`npm ci\` installs the npm workspaces from that lockfile. A workspace-local \`package-lock.json\` does not satisfy it."
            echo
            echo "Manifests in this diff:"
            for path in "${manifests[@]}"; do
              echo "- \`$path\`"
            done
            echo
            echo "Refresh the root lock (\`npm install\` at the repository root) and push \`package-lock.json\` on this branch. Auto-merge stays off until that file is part of the diff."
          } > "$comment_file"

          gh pr comment "$PR_URL" --body-file "$comment_file"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for patch and minor updates
        if: (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') && steps.lockfile.outputs.ok == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
