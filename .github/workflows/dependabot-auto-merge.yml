name: Dependabot auto-merge

# Enables squash auto-merge for Dependabot patch and minor updates.
# GitHub completes the merge only after required status checks pass.
# Major updates are left open for review.
# Prerequisite: Settings → General → Allow auto-merge. Squash merges must be allowed.

on:
  pull_request:
    branches: [main, master]

jobs:
  auto-merge:
    name: Auto-merge patch and minor
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
