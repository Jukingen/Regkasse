# Nightly coverage for the same non-PostgreSQL suite as backend-unit-tests.yml.
# Coverage collection is too slow for the PR gate (the 45-minute job timed out).
# Schedule runs only from the default branch. PostgreSQL-tagged tests stay in
# backend-postgres-integration-tests.yml.

name: Backend coverage

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: backend-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  CI: 'true'
  # Do not inherit developer REGKASSE_* env that would force OpenAPI/in-memory host mode.
  REGKASSE_OPENAPI_EXPORT: ''
  REGKASSE_TEST_INMEMORY_DB: ''

jobs:
  coverage:
    name: dotnet test with coverage (exclude Category=PostgreSql)
    runs-on: ubuntu-latest
    # Coverage collection ran past the 45-minute PR gate; nightly keeps room to finish.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore KasseAPI_Final.sln

      - name: Build
        working-directory: backend
        run: dotnet build KasseAPI_Final.sln --configuration Release --no-restore

      - name: Test with coverage
        working-directory: backend
        run: >-
          dotnet test KasseAPI_Final.Tests/KasseAPI_Final.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category!=PostgreSql"
          --verbosity minimal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/TestResults
          if-no-files-found: ignore
          retention-days: 7
