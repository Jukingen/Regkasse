global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: regkasse-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'host.docker.internal:5184'
        labels:
          service: backend
          env: production

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:5184/api/health/live
          - http://host.docker.internal:5184/api/health/ready
          - http://host.docker.internal:3000/health
          - http://host.docker.internal:3001/health
          - http://host.docker.internal:8081/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
