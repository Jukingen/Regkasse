# -----------------------------------------------------------------------------
# Regkasse — optional observability stack (Prometheus + Grafana + Loki + Alertmanager)
#
# Prerequisites: app stack publishing health/metrics on the host (Compose prod).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d
#
# Optional: join the prod network so Prometheus can scrape container DNS names:
#   MONITORING_APP_NETWORK=regkasse-prod_regkasse-prod
#   (uncomment the `app` network + service attachments below)
#
# UI (loopback by default):
#   Grafana       http://127.0.0.1:3002
#   Prometheus    http://127.0.0.1:9090
#   Alertmanager  http://127.0.0.1:9093
#
# Docs: docs/MONITORING.md · docs/ALERTING.md · docs/METRICS.md
# -----------------------------------------------------------------------------

name: regkasse-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: regkasse-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - regkasse_prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_HOST_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: regkasse-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '${ALERTMANAGER_HOST_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: regkasse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_grafana}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3002}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - regkasse_grafana_data:/var/lib/grafana
    ports:
      - '${GRAFANA_HOST_BIND:-127.0.0.1}:${GRAFANA_PORT:-3002}:3000'
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.1.1
    container_name: regkasse-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - regkasse_loki_data:/loki
    ports:
      - '${LOKI_HOST_BIND:-127.0.0.1}:${LOKI_PORT:-3100}:3100'
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.1.1
    container_name: regkasse-promtail
    restart: unless-stopped
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: regkasse-blackbox
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - '${BLACKBOX_HOST_BIND:-127.0.0.1}:${BLACKBOX_PORT:-9115}:9115'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  regkasse_prometheus_data:
  regkasse_grafana_data:
  regkasse_loki_data:
